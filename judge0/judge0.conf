# Local/self-hosted Judge0 configuration.
# Replace both CHANGE_ME values before exposing this host publicly.
JUDGE0_TELEMETRY_ENABLE=false
ENABLE_WAIT_RESULT=true
ENABLE_COMPILER_OPTIONS=false
ENABLE_COMMAND_LINE_ARGUMENTS=false
ENABLE_SUBMISSION_DELETE=false
ENABLE_BATCHED_SUBMISSIONS=true
ENABLE_CALLBACKS=false
USE_DOCS_AS_HOMEPAGE=false
DISABLE_IMPLICIT_BASE64_ENCODING=false
INTERVAL=0.1
COUNT=2
MAX_QUEUE_SIZE=100
ALLOW_ORIGIN=
AUTHN_HEADER=X-Auth-Token
AUTHN_TOKEN=collab-code-judge-change-me
AUTHZ_HEADER=X-Auth-User
AUTHZ_TOKEN=
REDIS_HOST=judge0-redis
REDIS_PORT=6379
REDIS_PASSWORD=collab-code-redis-change-me
POSTGRES_HOST=judge0-db
POSTGRES_PORT=5432
POSTGRES_DB=judge0
POSTGRES_USER=judge0
POSTGRES_PASSWORD=collab-code-postgres-change-me
