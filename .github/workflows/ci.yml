name: Collab Code CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  server-ci:
    name: Backend Tests & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install native language toolchains
        run: sudo apt-get update && sudo apt-get install -y g++ openjdk-17-jdk

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Typecheck server
        working-directory: server
        run: npm run typecheck

      - name: Run server test suite
        working-directory: server
        run: npm test

      - name: Build server distribution
        working-directory: server
        run: npm run build

  client-ci:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Typecheck client
        working-directory: client
        run: npm run typecheck

      - name: Build client production bundle
        working-directory: client
        run: npm run build
