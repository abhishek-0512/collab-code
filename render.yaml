services:
  # Collab Code Backend Web & WebSocket Server
  - type: web
    name: collab-code-server
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_URL
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: EXECUTION_PROVIDER
        value: judge0
      - key: JUDGE0_URL
        value: https://ce.judge0.com
      - key: JUDGE0_TOKEN
        sync: false
      - key: EXECUTION_TIMEOUT_MS
        value: '8000'
      - key: EXECUTION_OUTPUT_LIMIT_BYTES
        value: '262144'

  # Collab Code Frontend Single Page Application
  - type: web
    name: collab-code-client
    runtime: static
    plan: free
    rootDir: client
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: collab-code-server
          property: host
